name: Сборка APK

on:
  push:
    branches: [apk]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Версия и имя файла
        id: ver
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TG-Bridge-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TG-Bridge-${{ steps.ver.outputs.version }}
          path: dist/*.apk

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          FILE="dist/TG-Bridge-${{ steps.ver.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "TG Bridge ${{ steps.ver.outputs.version }}" --notes "$(git log -1 --format=%B)"
          fi
